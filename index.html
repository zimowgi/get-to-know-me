<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A conversation card game. Draw a card, read it aloud, and get to know each other." />
  <meta name="theme-color" content="#f7f1e3" />
  <title>Get to Know Me</title>

  <!-- Elegant fonts (free from Google Fonts). If offline, the page falls back to Georgia. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">

    <!-- ============ WELCOME SCREEN ============ -->
    <section id="welcome" class="screen">
      <div class="stack-deco" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <p class="eyebrow">A conversation card game</p>
      <h1 id="game-title">Get to Know Me</h1>
      <p id="game-description" class="lead"></p>
      <button id="start-btn" class="btn btn-primary" type="button">Start Playing</button>
      <p id="welcome-count" class="small-note"></p>
      <p id="welcome-error" class="error" role="alert" hidden></p>
    </section>

    <!-- ============ GAME SCREEN ============ -->
    <section id="game" class="screen" hidden>
      <div class="status">
        <p id="counter" class="counter" aria-live="polite">Question 1 of 100</p>
        <div class="progress" role="progressbar" aria-label="Round progress"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </div>

      <article id="card" class="card" tabindex="-1">
        <span class="quote-mark" aria-hidden="true">&ldquo;</span>
        <p id="card-label" class="card-label">Question 1</p>
        <p id="question-text" class="question" aria-live="polite"></p>
      </article>

      <div class="actions">
        <button id="random-btn" class="btn btn-primary btn-big" type="button">Get a Random Question</button>
        <div class="actions-row">
          <button id="next-btn" class="btn btn-secondary" type="button">Next Question</button>
          <button id="restart-btn" class="btn btn-ghost" type="button">Start Over</button>
        </div>
      </div>
    </section>

    <!-- ============ COMPLETION SCREEN ============ -->
    <section id="complete" class="screen" hidden>
      <div class="celebrate" aria-hidden="true">&#10022;</div>
      <h2 id="complete-title" tabindex="-1">You finished the deck!</h2>
      <p id="complete-text" class="lead"></p>
      <button id="again-btn" class="btn btn-primary btn-big" type="button">Shuffle &amp; Play Again</button>
    </section>

  </main>

  <footer class="footer">Take your time. The best answers come from good listening.</footer>

  <!-- Order matters: questions first, then the game logic. -->
  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
